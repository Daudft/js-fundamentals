<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="reel-cover">
                <div class="reel">
                    <img class="main-img" src="https://images.unsplash.com/photo-1508921912186-1d1a45ebb3c1?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">

                    <div class="bottom">
                        <div class="user">
                              <img class="pro-img" src="https://images.unsplash.com/photo-1550995694-3f5f4a7e1bd2?q=80&w=1171&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                        <h3>Jhon Nezz</h3>
                        <button class="f-btn">Follow</button>

                        </div>
                        <p>Where the river sings, the mountains listen.</p>
                      
                        
                    </div>
                    <div class="right">
                        <div class="like">
                            <h4 class="like-icon"><i class="ri-heart-3-fill"></i></h4>
                            <h5>200</h5>
                        </div>
                        <div class="comment">
                            <h4 class="comment-icon"><i class="ri-message-line"></i></h4>
                            <h5>50</h5>
                        </div>
                        <div class="share">
                            <h4 class="share-icon"><i class="ri-share-forward-line"></i></h4>
                            <h5>30</h5>
                        </div>
                        <div class="dot">
                            <h4 class="dot-icon"><i class="ri-more-2-fill"></i></h4>
                        </div>
                    </div>
                    

                </div>
            </div>
        </section>
    </main>



    <script src="script.js"></script>
</body>
</html>
